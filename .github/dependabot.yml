# 依存パッケージの更新を PR で知らせてもらう設定（設計書 7.6）
# 脆弱性の修正（security updates）は、この設定とは別にすぐ PR が作られる
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    # 公開されたばかりの版は避け、7日たってから提案してもらう（壊れた版や乗っ取られた版を避けるため）
    cooldown:
      default-days: 7
    # マイナー・パッチの更新は1つの PR にまとめる。メジャー更新は個別に確認する
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # 実行環境の Node.js（24）に合わせる。Node.js を上げるときにこの行を外す
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next の中のプラグイン（react・jsx-a11y・import）が ESLint 10 に対応するまで見送る
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
